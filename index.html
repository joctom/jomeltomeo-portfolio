<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jomel Tomeo — AI Artist, Full-Stack Web Developer, Figma UI/UX Designer & Video Editor based in Lucena City, Philippines."
    />
    <meta name="theme-color" content="#fbfaf7" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("portfolio-color-mode");
          if (t !== "dark") {
            t = "light";
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", t === "light" ? "#fbfaf7" : "#1a1917");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,600;1,6..96,700&family=Libre+Baskerville:ital,wght@1,400;1,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Jomel Tomeo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
